<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSFW Status Bar - 3 Page Interactive</title>


  <!-- 3D Rendering Library (for D20 visual only, no physics) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- LXGW WenKai Font (霞鹜楷体) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css">
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

  <style>
    /* Animations */
    @keyframes wzx-pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.9;
        text-shadow: 0 0 15px rgba(255, 92, 134, 0.4);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes wzx-float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      33% {
        transform: translateY(-3px) rotate(0.5deg);
      }

      66% {
        transform: translateY(2px) rotate(-0.5deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .mes_text {
      width: 100%;
      max-width: 480px;
      position: relative;
    }

    /* Main Container */
    .wzx-nsfw-bar {
      background: #2D353C;
      border-radius: 24px;
      color: #FFFFFF;
      overflow: hidden;
      margin-top: 16px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Progress Bar (3 segments) */
    .wzx-progress-container {
      display: flex;
      gap: 6px;
      padding: 16px 20px 0;
      flex-shrink: 0;
      position: absolute;
      top: 0;
      width: 100%;
    }

    .wzx-progress-segment {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .wzx-progress-segment.active {
      background: #FF5C86;
      box-shadow: 0 0 8px rgba(255, 92, 134, 0.4);
    }

    /* Carousel */
    .wzx-carousel {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .wzx-carousel .wzx-page:nth-child(1) {
      padding: 0;
    }

    .wzx-page {
      display: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 30px 20px 60px; /* Added bottom padding for footer button */
      flex-direction: column;
      opacity: 0;
      transform: translateX(20px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .wzx-page.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
      display: flex;
    }

    .wzx-page.prev {
      transform: translateX(-20px);
      opacity: 0;
    }

    /* ==============================
       Page 1: Body Map & State
       ============================== */
    .wzx-p1-container {
      display: flex;
      height: 100%;
      position: relative;
      transition: filter 0.4s ease;
    }

    /* Game active blur effect */
    .wzx-p1-container.game-blur {
      filter: blur(8px) brightness(0.7);
      pointer-events: none;
    }

    /* Top-right game emoji buttons */
    .wzx-game-btns {
      position: absolute;
      top: 22px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    .wzx-game-emoji {
      font-size: 22px;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s ease;
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .wzx-game-emoji:hover {
      opacity: 1;
      transform: scale(1.15);
      text-shadow: 0 0 12px rgba(255,92,134,0.6);
    }

    /* Left: Stats */
    .wzx-stats-col {
      width: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
      position: absolute;
      background: rgba(0, 0, 0, 0.4);
      padding: 14px;
      border-radius: 14px;
      top: 34px;
      left: 14px;
    }

    .wzx-big-number {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF9C4C, #FF5C86);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      animation: wzx-pulse 2s infinite ease-in-out;
    }

    .wzx-stat-label {
      font-size: 10px;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .wzx-mini-tags {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wzx-mini-tag {
      font-size: 11px;
      color: #FF5C86;
      background: rgba(255, 92, 134, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      width: fit-content;
      border-left: 2px solid #FF5C86;
      cursor: pointer;
    }

    .wzx-mini-tag:hover {
      background: rgba(255, 92, 134, 0.2);
    }

    /* Right: Interactive Body */
    .wzx-body-col {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wzx-body-svg {
      height: auto;
      /* 控制身体大小 */
      width: auto;
      aspect-ratio: 832 / 1216;
      filter: drop-shadow(0 0 10px rgba(255, 92, 134, 0.2));
      opacity: 0.9;
      transition: all 0.5s ease;
      /* 柔和边缘效果 */
      border-radius: 14px;
      /* 边缘渐变遮罩 - 让四周渐变透明融入背景 */
      -webkit-mask-image: radial-gradient(ellipse 85% 80% at center, black 50%, transparent 100%);
      mask-image: radial-gradient(ellipse 85% 80% at center, black 50%, transparent 100%);
    }

    /* 身体背景层级样式 - 每33%切换一次 (共5级) */
    .wzx-body-svg.level-0 {
      background: url('https://files.catbox.moe/woumw7.png') center/cover no-repeat;
      /* 0-33% */
      filter: drop-shadow(0 0 8px rgba(100, 149, 237, 0.3));
    }

    .wzx-body-svg.level-1 {
      background: url('https://files.catbox.moe/itsq4b.png') center/cover no-repeat;
      /* 33-66% */
      filter: drop-shadow(0 0 10px rgba(130, 130, 200, 0.4));
    }

    .wzx-body-svg.level-2 {
      background: url('https://files.catbox.moe/9mdjo2.png') center/cover no-repeat;
      /* 66-100% */
      filter: drop-shadow(0 0 12px rgba(180, 100, 180, 0.5));
    }

    /* 身体百分比标签 */
    .wzx-body-percentage {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255, 92, 134, 0.15);
      border: 1px solid rgba(255, 92, 134, 0.4);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #FF5C86;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .wzx-body-percentage:hover {
      background: rgba(255, 92, 134, 0.25);
      transform: scale(1.05);
    }

    .wzx-body-percentage.level-0 {
      color: #6495ED;
      border-color: rgba(100, 149, 237, 0.4);
      background: rgba(100, 149, 237, 0.15);
    }

    .wzx-body-percentage.level-1 {
      color: #8282C8;
      border-color: rgba(130, 130, 200, 0.4);
      background: rgba(130, 130, 200, 0.15);
    }

    .wzx-body-percentage.level-2 {
      color: #B464B4;
      border-color: rgba(180, 100, 180, 0.4);
      background: rgba(180, 100, 180, 0.15);
    }

    .wzx-body-percentage.level-3 {
      color: #FF69B4;
      border-color: rgba(255, 105, 180, 0.4);
      background: rgba(255, 105, 180, 0.15);
    }

    .wzx-body-percentage.level-4 {
      color: #FF5C86;
      border-color: rgba(255, 92, 134, 0.5);
      background: rgba(255, 92, 134, 0.2);
      animation: wzx-pulse 1.5s infinite ease-in-out;
    }

    .wzx-body-path {
      fill: rgba(255, 255, 255, 0.1);
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1.5;
      transition: all 0.3s;
    }

    /* Hotspots (invisible click areas) */
    .wzx-hotspot {
      cursor: pointer;
      opacity: 0;
      fill: transparent;
      transition: all 0.2s;
    }

    /* Active Indicators (Soft Ambient Glow) */
    .wzx-indicator {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(255, 92, 134, 0.4) 0%, rgba(255, 92, 134, 0.15) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: wzx-glow-pulse 2.5s infinite ease-in-out;
      opacity: 0.5;
      z-index: 50;
      transform: translate(-50%, -50%);
      filter: blur(3px);
      transition: all 0.3s ease;
    }

    /* Hover state - brighter glow */
    .wzx-indicator.glow-active {
      opacity: 1;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(255, 92, 134, 0.8) 0%, rgba(255, 92, 134, 0.4) 40%, transparent 70%);
      filter: blur(2px);
      animation: none;
    }

    @keyframes wzx-glow-pulse {
      0%, 100% { 
        opacity: 0.4; 
        transform: translate(-50%, -50%) scale(0.9);
      }
      50% { 
        opacity: 0.7; 
        transform: translate(-50%, -50%) scale(1.05);
      }
    }

    /* Interaction Popup */
    .wzx-interact-popup {
      position: absolute;
      background: rgba(31, 36, 41, 0.95);
      border: 1px solid #FF5C86;
      border-radius: 12px;
      padding: 12px;
      width: 240px; /* Fixed width */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: top left;
      transform: scale(0.9);
      /* Default hidden */
      display: none;
    }

    .wzx-interact-popup.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      display: block;
    }

    .wzx-popup-title {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
      font-weight: 700;
    }

    .wzx-popup-btn {
      display: block;
      width: 100%;
      background: rgba(255, 92, 134, 0.1);
      border: none;
      color: #FF5C86;
      padding: 8px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .wzx-popup-btn:hover {
      background: #FF5C86;
      color: white;
    }

    /* Action Images in Popup */
    .wzx-action-img {
      width: 65px;
      height: 65px;
      background: rgba(255, 92, 134, 0.1);
      border: 1px solid rgba(255, 92, 134, 0.3);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      object-fit: cover;
    }

    .wzx-action-img:hover {
      transform: scale(1.05);
      border-color: #FF5C86;
      box-shadow: 0 0 10px rgba(255, 92, 134, 0.3);
    }

    /* Indicator Positions (Percentage-based for image alignment) */
    .ind-head {
      top: 18%;
      left: 50%;
    }

    .ind-chest {
      top: 42%;
      left: 50%;
    }

    .ind-groin {
      top: 72%;
      left: 50%;
    }

    /* ==============================
       Left Quick Action Buttons (3-button vertical stack)
       ============================== */
    .wzx-quick-btn {
      position: absolute;
      left: 15px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 60;
      transition: all 0.3s ease;
    }

    .wzx-quick-btn img {
      width: 100%;
      height: 100%;
      filter: brightness(0) invert(1) drop-shadow(0 0 3px rgba(255,92,134,0.5));
      transition: all 0.3s ease;
    }

    .wzx-quick-btn:hover img {
      filter: brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,92,134,0.9));
      transform: scale(1.1);
    }

    .wzx-quick-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 55px;
      height: 55px;
      background: radial-gradient(circle, rgba(255,92,134,0.4) 0%, rgba(255,92,134,0.1) 50%, transparent 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: wzx-glow-pulse 2.5s infinite ease-in-out;
      pointer-events: none;
      filter: blur(3px);
    }

    .wzx-quick-btn:hover .wzx-quick-glow {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, rgba(255,92,134,0.7) 0%, rgba(255,92,134,0.3) 50%, transparent 70%);
      animation: none;
    }

    /* Button Positions */
    .wzx-sex-btn { 
      bottom: 160px; 
      transform: scale(0.85); /* sex icon appears larger, scale down */
    }
    .wzx-foot-btn { bottom: 110px; }
    .wzx-condom-btn { bottom: 60px; }

    /* Horizontal Tag Popup (for sex/condom - text+emoji style) */
    .wzx-tag-popup {
      position: absolute;
      left: 60px;
      background: rgba(31, 36, 41, 0.98);
      border: 1px solid #FF5C86;
      border-radius: 10px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(255,92,134,0.3);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-10px) scale(0.95);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: none;
      white-space: nowrap;
    }

    .wzx-tag-popup.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) scale(1);
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 280px;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .wzx-sex-popup { bottom: 165px; }
    .wzx-condom-popup { bottom: 65px; }

    .wzx-tag-item {
      background: rgba(255,92,134,0.15);
      border: 1px solid rgba(255,92,134,0.3);
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* .wzx-tag-item:hover definition removed, moved to later section */

    .wzx-tag-icon {
      font-size: 14px;
    }

    /* Foot Popup (image preview mode like body parts) */
    .wzx-foot-popup {
      position: absolute;
      bottom: 120px;
      left: 60px;
      background: rgba(31, 36, 41, 0.98);
      border: 1px solid #FF5C86;
      border-radius: 12px;
      padding: 12px;
      width: 240px;
      box-shadow: 0 4px 25px rgba(255,92,134,0.3);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px) scale(0.95);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: none;
    }

    .wzx-foot-popup.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      display: block;
    }

    .wzx-foot-popup-title {
      font-size: 10px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
      font-weight: 700;
    }

    .wzx-foot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .wzx-foot-action-img {
      width: 65px;
      height: 65px;
      background: rgba(255, 92, 134, 0.1);
      border: 1px solid rgba(255, 92, 134, 0.3);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      object-fit: cover;
    }

    .wzx-foot-action-img:hover {
      transform: scale(1.05);
      border-color: #FF5C86;
      box-shadow: 0 0 10px rgba(255, 92, 134, 0.3);
    }

    /* ==============================
       Page 2: Body Details List (Text)
       ============================== */
    .wzx-detail-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .wzx-detail-icon {
      font-size: 18px;
      background: rgba(255, 255, 255, 0.05);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .wzx-detail-text {
      flex: 1;
    }

    .wzx-detail-title {
      color: #FF5C86;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
    }

    .wzx-detail-desc {
      color: #ccc;
      font-size: 13px;
      line-height: 1.35;
    }

    /* ==============================
       Page 2: Interactive Features
       Style: Organic Flesh + Neon Accents
       ============================== */
    
    /* Make detail items interactive */
    .wzx-detail-item {
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: visible; /* Allow bubbles to pop out */
    }

    /* Hover State - Slight swell */
    .wzx-detail-item:hover {
      background: rgba(255, 92, 134, 0.05);
      transform: scale(1.02);
      border-color: rgba(255, 92, 134, 0.4);
    }

    /* Mist Overlay - Organic Fade */
    .wzx-mist-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(31, 36, 41, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 5;
      border-radius: inherit;
      /* Subtle noise texture for mist */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
    }

    .wzx-detail-item:hover .wzx-mist-overlay {
      opacity: 0;
    }

    /* Whisper Bubble - Ethereal Mist Style (Scheme B) */
    .wzx-whisper-bubble {
      position: absolute;
      /* Initial state */
      opacity: 0;
      transform: translateX(-50%) scale(0.8); /* Center origin */
      
      /* Text Only (Floating) */
      background: transparent;
      border: none;
      box-shadow: none;
      
      color: #fff;
      font-size: 18px; /* Slightly larger for Cursive */
      font-weight: 400;
      font-family: 'ZCOOL KuaiLe', cursive; /* User Selected Font */
      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 100;
      
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
      
      /* Transitions for entry */
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Remove Tail */
    .wzx-whisper-bubble::after {
      display: none;
    }

    .wzx-whisper-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      /* Float Up Animation */
      animation: wzx-float-up 4s ease-out forwards;
    }

    /* Tiered Colors & Glows (All Warm Theme) */
    .wzx-whisper-bubble.whisper-low {
      /* Warm Blush / Soft Champagne - changing from Cyan */
      color: #ffe6f2; 
      text-shadow: 0 0 10px rgba(255, 192, 203, 0.6), 0 0 20px rgba(255, 182, 193, 0.3);
      filter: blur(0.3px);
      animation: wzx-float-up 4s ease-out forwards, wzx-mist-drift 3s infinite ease-in-out alternate;
    }

    .wzx-whisper-bubble.whisper-mid {
      color: #ffd6b3;
      text-shadow: 0 0 10px rgba(255, 150, 100, 0.6), 0 0 20px rgba(255, 150, 100, 0.3);
      filter: blur(0.2px);
    }

    .wzx-whisper-bubble.whisper-high {
      color: #ffbfcf;
      text-shadow: 0 0 12px rgba(255, 50, 80, 0.8), 0 0 25px rgba(255, 50, 80, 0.4);
      animation: wzx-float-up 4s ease-out forwards, wzx-bubble-shake 0.3s infinite;
    }

    .wzx-whisper-bubble.whisper-climax {
      color: #ff004c;
      font-size: 20px; /* Even larger for impact */
      font-weight: 800;
      text-shadow: 0 0 15px rgba(255, 0, 60, 0.9), 0 0 30px rgba(255, 0, 60, 0.6);
      animation: wzx-float-up 4s ease-out forwards, wzx-bubble-shake 0.08s infinite;
    }

    /* Keyframes - updated with translateX(-50%) */
    @keyframes wzx-float-up {
      0% { margin-top: 0; opacity: 0; transform: translateX(-50%) scale(0.8); }
      10% { opacity: 1; transform: translateX(-50%) scale(1); }
      80% { opacity: 0.8; }
      100% { margin-top: -80px; opacity: 0; transform: translateX(-50%) scale(1.1); }
    }
    
    @keyframes wzx-mist-drift {
      from { transform: translateX(calc(-50% - 5px)); }
      to { transform: translateX(calc(-50% + 5px)); }
    }

    @keyframes wzx-bubble-shake {
      0% { transform: translateX(-50%) rotate(0deg) skewX(0); }
      25% { transform: translateX(-50%) rotate(-3deg) skewX(-2deg); }
      75% { transform: translateX(-50%) rotate(3deg) skewX(2deg); }
      100% { transform: translateX(-50%) rotate(0deg) skewX(0); }
    }
    /* Charging State - Organic Pulse & Flush */
    @keyframes wzx-flesh-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 92, 134, 0); }
      50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(255, 92, 134, 0.3); }
      100% { transform: scale(1); box-shadow: 0 0 0 rgba(255, 92, 134, 0); }
    }

    .wzx-detail-item.charging {
      /* Red flush background (Hyperemia) */
      background: linear-gradient(135deg, rgba(255, 50, 80, 0.1), rgba(255, 92, 134, 0.05));
      border-color: #FF5C86;
      animation: wzx-flesh-pulse 0.8s infinite ease-in-out;
    }

    /* Throb effect for Icon */
    .wzx-detail-item.charging .wzx-detail-icon {
      animation: wzx-icon-throb 0.4s infinite alternate;
      filter: drop-shadow(0 0 8px #FF5C86);
    }

    @keyframes wzx-icon-throb {
      from { transform: scale(1); }
      to { transform: scale(1.15); filter: drop-shadow(0 0 12px #FF5C86); }
    }

    /* Overloaded State - Liquid Burst */
    .wzx-detail-item.overloaded {
      background: linear-gradient(135deg, rgba(255, 50, 80, 0.3), rgba(255, 92, 134, 0.2));
      border-color: #FF3250;
      box-shadow: 0 0 20px rgba(255, 50, 80, 0.4);
      transform: scale(0.98); /* Contraction */
      transition: transform 0.1s;
    }

    .wzx-detail-item.overloaded .wzx-detail-title {
      color: #fff;
      text-shadow: 0 0 10px #FF3250;
    }

    .wzx-detail-item.overloaded .wzx-detail-desc {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Liquid Particles */
    .wzx-particle {
      position: fixed;
      font-size: 18px; /* Slightly larger */
      pointer-events: none;
      z-index: 9999;
      animation: wzx-liquid-fly 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    @keyframes wzx-liquid-fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5);
      }
      20% {
        opacity: 1;
        transform: translate(calc(var(--dx) * 0.2), calc(var(--dy) * 0.2)) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    /* ==============================
       Page 3: Monologue
       ============================== */
    .wzx-monologue-box {
      font-style: italic;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.6;
      font-size: 16px;
      position: relative;
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(255, 92, 134, 0.1), transparent 70%);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: wzx-float 6s infinite ease-in-out;
    }

    .wzx-monologue-quote {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.1);
      font-family: serif;
      line-height: 1;
    }

    .wzx-monologue-quote-end {
      position: absolute;
      bottom: -10px;
      right: 20px;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.1);
      font-family: serif;
      line-height: 1;
    }

    /* Footer & Controls */
    .wzx-footer {
      display: flex;
      justify-content: flex-end;
      /* 右对齐Next按钮 */
      align-items: center;
      margin-top: 2px;
      flex-shrink: 0;
      position: absolute;
      bottom: 12px;
      right: 20px;
    }

    .wzx-btn-prev {
      background: transparent;
      color: #FF5C86;
      border: none;
      padding: 8px 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wzx-btn-prev:hover {
      opacity: 0.8;
      transform: translateX(-2px);
    }

    .wzx-btn-next {
      background: #FF5C86;
      color: #FFFFFF;
      border: none;
      border-radius: 100px;
      padding: 8px 24px;
      height: 40px;
      box-sizing: border-box;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 92, 134, 0.2);
    }

    .wzx-btn-next:hover {
      box-shadow: 0 6px 16px rgba(255, 92, 134, 0.3);
    }

    /* Floating Action Input (Global) - Left Aligned Full Width */
    .wzx-float-input {
      position: absolute;
      bottom: 12px;
      left: 20px;
      /* 左对齐，与内容区对齐 */
      right: 110px;
      /* 为Next按钮留出空间 */
      height: 40px;

      background: #1F2429;
      border: 1px solid #FF5C86;
      border-radius: 100px;
      padding: 4px 6px 4px 16px;

      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }

    /* Mute Button (Page 2) */
    .wzx-mute-btn {
      position: absolute;
      top: 22px;
      right: 22px; /* Moved left to align sound waves with header */
      font-size: 20px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
      z-index: 100;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
    }
    
    .wzx-mute-btn:hover {
      opacity: 1;
      transform: scale(1.1);
      text-shadow: 0 0 10px rgba(255, 92, 134, 0.5);
    }

    .wzx-float-input {
      transform: translateY(10px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
    }

    .wzx-float-input.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .wzx-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      outline: none;
      min-width: 0;
    }

    .wzx-mini-send {
      background: linear-gradient(135deg, #FF9C4C, #FF5C86);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 0 14px;
      height: 28px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* 清除按钮 (x) */
    .wzx-input-clear {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      font-size: 16px;
      padding: 0 8px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }

    .wzx-input-clear:hover {
      color: #fff;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .wzx-tag-popup::-webkit-scrollbar,
    .wzx-tag-item::-webkit-scrollbar,
    div[style*="overflow-x:auto"]::-webkit-scrollbar {
      display: none;
    }

    /* Disable scrollbar for IE, Edge and Firefox */
    .wzx-tag-popup,
    div[style*="overflow-x:auto"] {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }

    /* ==============================
       Tag Management System 2.0
       ============================== */
    
    /* Tag Collect Button */
    .wzx-tag-collect-btn {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 92, 134, 0.2);
      border: 1px solid rgba(255, 92, 134, 0.5);
      color: #FF5C86;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .wzx-tag-collect-btn:hover {
      background: rgba(255, 92, 134, 0.4);
      border-color: #FF5C86;
    }

    /* Badge */
    .wzx-tag-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 16px;
      height: 16px;
      background: #FF5C86;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(255, 92, 134, 0.5);
    }

    .wzx-tag-badge.hidden {
      display: none;
    }

    /* Tag Drawer (Above Input) */
    .wzx-tag-drawer {
      position: absolute;
      bottom: 57px; /* 12px (input bottom) + 40px (input height) + 5px (gap) */
      left: 20px;
      right: 110px; /* Same as float-input */
      background: #1F2429;
      border: 1px solid rgba(255, 92, 134, 0.3);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.4);
      z-index: 25;
      
      transform: translateY(10px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .wzx-tag-drawer.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .wzx-drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
    }

    .wzx-drawer-close {
      cursor: pointer;
      color: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      transition: color 0.2s;
    }

    .wzx-drawer-close:hover {
      color: #fff;
    }

    .wzx-drawer-body {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;
    }

    .wzx-drawer-body::-webkit-scrollbar {
      width: 4px;
    }

    .wzx-drawer-body::-webkit-scrollbar-thumb {
      background: rgba(255, 92, 134, 0.3);
      border-radius: 2px;
    }

    /* Tag Chip */
    .wzx-tag-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 92, 134, 0.15);
      border: 1px solid rgba(255, 92, 134, 0.4);
      border-radius: 100px;
      color: #FF5C86;
      font-size: 11px;
      font-weight: 500;
    }

    .wzx-chip-delete {
      cursor: pointer;
      color: rgba(255, 92, 134, 0.6);
      font-size: 12px;
      transition: color 0.2s;
    }

    .wzx-chip-delete:hover {
      color: #fff;
    }

    .wzx-drawer-footer {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .wzx-clear-all-btn {
      background: transparent;
      border: 1px solid rgba(255, 92, 134, 0.3);
      color: rgba(255, 92, 134, 0.7);
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wzx-clear-all-btn:hover {
      background: rgba(255, 92, 134, 0.2);
      color: #FF5C86;
    }

    .wzx-drawer-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      padding: 20px;
    }

    .wzx-tag-item:hover {
      background: rgba(255,92,134,0.4);
      border-color: #FF5C86;
      /* removed transform translateY */
      box-shadow: 0 0 8px rgba(255, 92, 134, 0.4);
    }

    /* ==============================
       Game Mode: Lust Rain
       ============================== */
    /* Dice Button (Entry) */
    .wzx-dice-btn {
      position: absolute;
      top: 34px;
      right: 20px;
      width: 32px;
      height: 32px;
      background: rgba(255, 92, 134, 0.1);
      border: 1px solid rgba(255, 92, 134, 0.3);
      border-radius: 8px;
      color: #FF5C86;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }

    .wzx-dice-btn:hover {
      background: #FF5C86;
      color: #fff;
      transform: rotate(15deg);
    }

    /* Full Screen Game Overlay */
    .wzx-game-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent; /* Transparent so blurred main content shows */
      z-index: 100;
      display: none;
      /* Default Hidden */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .wzx-game-overlay.active {
      display: flex;
      animation: fadeIn 0.3s forwards;
    }

    /* Dice mode: hide timer and score */
    .wzx-game-overlay.dice-mode .wzx-game-timer-number,
    .wzx-game-overlay.dice-mode .wzx-game-score-watermark {
      display: none !important;
    }

    /* Game UI Elements */
    /* Hide timer bar - replaced by corner number */
    .wzx-game-timer-bar {
      display: none;
    }

    /* Timer Number (Top Left) */
    .wzx-game-timer-number {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 48px;
      font-weight: 800;
      color: #FF5C86;
      text-shadow: 0 0 15px rgba(255, 92, 134, 0.6);
      z-index: 10;
    }

    /* Score Watermark (Center Background) */
    .wzx-game-score-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 150px;
      font-weight: 900;
      color: rgba(255, 92, 134, 0.12);
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    /* Old score display hidden */
    .wzx-game-score {
      display: none;
    }

    /* Hide UI elements during wave game */
    .wzx-game-btns.game-active,
    .wzx-quick-btn.game-active,
    .wzx-footer.game-active {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .wzx-game-start-btn {
      padding: 12px 32px;
      background: #FF5C86;
      color: #fff;
      border: none;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 92, 134, 0.5);
      animation: wzx-pulse 1.5s infinite;
    }

    .wzx-game-title {
      font-size: 24px;
      color: #fff;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #FF5C86;
    }

    /* Falling Tags */
    .wzx-falling-tag {
      position: absolute;
      top: 0;
      left: 0;
      /* JS controls transform x/y */
      padding: 8px 14px;
      background: rgba(255, 92, 134, 0.15);
      border: 1px solid rgba(255, 92, 134, 0.4);
      border-radius: 100px;
      color: #FF5C86;
      font-size: 13px;
      font-weight: 600;
      cursor: default;
      user-select: none;
      white-space: nowrap;
      pointer-events: auto !important;
      box-shadow: 0 0 10px rgba(255, 92, 134, 0.1);
      z-index: 50;
    }

    /* Hover effect - visual feedback for swipe detection */
    .wzx-falling-tag:hover {
      background: rgba(255, 92, 134, 0.5);
      border-color: #FF5C86;
      box-shadow: 0 0 20px rgba(255, 92, 134, 0.6);
    }

    .wzx-falling-tag:active {
      filter: brightness(1.5);
    }

    .wzx-falling-tag.caught {
      animation: wzx-pop 0.35s ease-out forwards;
      pointer-events: none;
    }



    /* Target inner span for animation */
    .wzx-falling-tag .tag-content {
      display: inline-block;
      width: 100%;
      height: 100%;
    }

    /* Target inner span for animation */
    /* Renamed to wzx-pop-inner to avoid conflicts */
    @keyframes wzx-pop-inner {
      0% {
        transform: scale(1);
        opacity: 1;
        color: #FF0055; /* Neon Crimson: High contrast & Passionate */
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
      }
      30% {
        transform: scale(1.5);
        opacity: 1;
        color: #FF0055;
        text-shadow: 0 0 20px #FF0055, 0 0 40px #FF0055;
      }
      100% {
        transform: scale(2.0);
        opacity: 0;
        color: #FF0055;
        text-shadow: 0 0 30px #FF0055;
        filter: blur(2px);
      }
    }

    .wzx-falling-tag.caught .tag-content {
      animation: wzx-pop-inner 0.35s ease-out forwards;
    }
    
    .wzx-falling-tag.caught {
      pointer-events: none;
      animation: none !important; /* Force disable pop on parent */
    }
    .wzx-ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 92, 134, 0.8) 0%, transparent 70%);
      pointer-events: none;
      z-index: 60;
      animation: wzx-ripple-expand 0.4s ease-out forwards;
    }

    @keyframes wzx-ripple-expand {
      0% {
        transform: translate(-50%, -50%) scale(0.5);
        opacity: 1;
        box-shadow: 0 0 0 2px rgba(255, 92, 134, 0.8);
      }
      50% {
        opacity: 0.7;
        box-shadow: 0 0 20px 10px rgba(255, 92, 134, 0.4);
      }
      100% {
        transform: translate(-50%, -50%) scale(6);
        opacity: 0;
        box-shadow: 0 0 40px 20px transparent;
      }
    }

    /* Score Pulse Animation */
    .wzx-game-score-watermark.pulse {
      animation: wzx-score-pulse 0.3s ease-out;
    }

    @keyframes wzx-score-pulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        color: rgba(255, 92, 134, 0.12);
      }
      40% {
        transform: translate(-50%, -50%) scale(1.2);
        color: rgba(255, 92, 134, 0.5);
        text-shadow: 0 0 30px rgba(255, 92, 134, 0.8);
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        color: rgba(255, 92, 134, 0.12);
        text-shadow: none;
      }
    }

    /* ==============================
       3D Interaction: Fate Dice (FVTT Style)
       ============================== */
    .wzx-dice-stage {
      perspective: 1000px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      display: none;
      /* Hidden by default */
      z-index: 200;
      pointer-events: none;
    }

    .wzx-dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(0deg) rotateY(0deg);
    }

    .wzx-dice-cube.rolling {
      animation: dice-tumble 1.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    .dice-face {
      position: absolute;
      width: 100px;
      height: 100px;
      background: rgba(31, 36, 41, 0.95);
      border: 2px solid #FF5C86;
      border-radius: 16px;
      color: #FF5C86;
      font-size: 40px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(255, 92, 134, 0.2);
    }

    /* 3D Cube Faces */
    .face-1 {
      transform: rotateY(0deg) translateZ(50px);
    }

    .face-2 {
      transform: rotateY(90deg) translateZ(50px);
    }

    .face-3 {
      transform: rotateY(180deg) translateZ(50px);
    }

    .face-4 {
      transform: rotateY(-90deg) translateZ(50px);
    }

    .face-5 {
      transform: rotateX(90deg) translateZ(50px);
    }

    .face-6 {
      transform: rotateX(-90deg) translateZ(50px);
    }

    @keyframes dice-tumble {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
      }

      20% {
        transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(0.8);
      }

      50% {
        transform: rotateX(1440deg) rotateY(720deg) rotateZ(360deg) scale(1.2);
      }

      100% {
        transform: rotateX(2160deg) rotateY(1080deg) rotateZ(720deg) scale(1.0);
      }

      /* Random end rotation set via JS usually, but here just spin effect */
    }

    /* ==============================
       3D Interaction: Fate Dice (FVTT Style)
       ============================== */
    /* ... (existing dice styles) ... */

    /* ==============================
       Page 3: Simple Flip Card (Monologue)
       ============================== */
    .wzx-tarot-container {
      width: 100%;
      height: 240px;
      perspective: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Base Card Style */
    .wzx-tarot-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      /* 默认浮动动画 */
    }

    .wzx-tarot-card:not(.flipped):not(.flipping-to-back):not(.flipping-to-front) {
      animation: wzx-float 6s ease-in-out infinite;
    }

    /* 翻转到背面 - 高优先级 */
    .wzx-tarot-card.flipping-to-back {
      animation: card-flip-to-back 0.6s ease forwards !important;
    }

    /* 翻转回正面 - 高优先级 (覆盖 .flipped) */
    .wzx-tarot-card.flipped.flipping-to-front {

        const seconds = Math.ceil(remaining / 1000);
        
        // Update timer bar (hidden now)
        timerBar.style.width = (remaining / duration * 100) + '%';
        
        // Update timer number (new)
        if (timerNumber) timerNumber.textContent = seconds + 's';

    function spawnTag() {
      const el = document.createElement('div');
      el.className = 'wzx-falling-tag';
      // Use inner span for content to allow separate animation
      el.innerHTML = `<span class="tag-content">${gameTags[Math.floor(Math.random() * gameTags.length)]}</span>`;
      el.style.pointerEvents = 'auto';

      const w = widget.offsetWidth;
      const h = widget.offsetHeight;
      
      // Random spawn edge: 0=top, 1=bottom, 2=left, 3=right
      const edge = Math.floor(Math.random() * 4);
      
      // Speed variation: 0.6 ~ 1.4 multiplier (fast and slow mix)
      const speedMult = 0.6 + Math.random() * 0.8;
      
      let startX, startY, vx, vy, gravity;
      
      switch (edge) {
        case 0: // Top edge - fall down with slight arc
          startX = Math.random() * w;
          startY = -50;
          vx = (Math.random() - 0.5) * 3 * speedMult;
          vy = (2 + Math.random() * 3) * speedMult;
          gravity = 0.08;
          break;
          
        case 1: // Bottom edge - launch up (classic fruit ninja)
          const fromLeft = Math.random() > 0.5;
          startX = fromLeft ? -30 : w + 30;
          startY = h + 30;
          const targetX = w * (0.2 + Math.random() * 0.6);
          vx = ((targetX - startX) / 50) * speedMult;
          vy = -(6 + Math.random() * 4) * speedMult;
          gravity = 0.12;
          break;
          
        case 2: // Left edge - fly right with arc
          startX = -50;
          startY = h * (0.3 + Math.random() * 0.4);
          vx = (4 + Math.random() * 3) * speedMult;
          vy = (Math.random() - 0.5) * 4 * speedMult;
          gravity = 0.06;
          break;
          
        case 3: // Right edge - fly left with arc
          startX = w + 50;
          startY = h * (0.3 + Math.random() * 0.4);
          vx = -(4 + Math.random() * 3) * speedMult;
          vy = (Math.random() - 0.5) * 4 * speedMult;
          gravity = 0.06;
          break;
      }

      const tagObj = {
        el: el,
        x: startX,
        y: startY,
        vx: vx,
        vy: vy,
        gravity: gravity,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 8 * speedMult,
        isCaught: false
      };

      // Swipe Detection (mouseover + mousemove for PC, touchstart for mobile)
      const triggerCatch = () => {
        if (!tagObj.isCaught) catchTag(tagObj);
      };
      el.onmouseover = triggerCatch;
      el.onmousemove = triggerCatch;
      el.ontouchstart = (e) => {
        e.preventDefault();
        triggerCatch();
      };

      gameArea.appendChild(el);
      activeTags.push(tagObj);
    }

    function updatePhysics() {
      const w = widget.offsetWidth;
      const h = widget.offsetHeight;
      
      for (let i = activeTags.length - 1; i >= 0; i--) {
        const tag = activeTags[i];
        if (tag.isCaught) continue;

        // Physics
        tag.x += tag.vx;
        tag.y += tag.vy;
        tag.vy += tag.gravity; // Gravity always pulls down
        tag.rot += tag.vrot;

        // Render
        tag.el.style.transform = `translate(${tag.x}px, ${tag.y}px) rotate(${tag.rot}deg)`;

        // Bounds Check - remove if completely off screen (any direction)
        const margin = 150;
        if (tag.y > h + margin || tag.y < -margin || 
            tag.x > w + margin || tag.x < -margin) {
          tag.el.remove();
          activeTags.splice(i, 1);
        }
      }

      physicsLoop = requestAnimationFrame(updatePhysics);
    }

    function catchTag(tagObj) {
      if (tagObj.isCaught) return;

      const scoreWatermark = document.getElementById('gameScoreWatermark');

        scoreWatermark.classList.remove('pulse');

      const ripple = document.createElement('div');

      const text = tagObj.el.textContent;
      collectTag(text); // Use Tag Management System instead of appendAction

      // Pop Animation (Trigger on parent, CSS targets inner span)
      tagObj.el.classList.add('caught');

      // Remove from physics array
      const idx = activeTags.indexOf(tagObj);
      if (idx > -1) activeTags.splice(idx, 1);

      // Cleanup DOM later
      setTimeout(() => { if (tagObj.el.parentNode) tagObj.el.remove(); }, 400);
    }

    const diceCanvas = document.getElementById('diceCanvas');
    let diceScene, diceCamera, diceRenderer, diceMesh;

    function initDiceEngine() {

      diceCamera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
      diceCamera.position.set(0, 0, 4);
      diceCamera.lookAt(0, 0, 0);

      // Renderer
      diceRenderer = new THREE.WebGLRenderer({ canvas: diceCanvas, antialias: true, alpha: true });
      diceRenderer.setSize(W, H);
      diceRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      diceRenderer.setClearColor(0x000000, 0);
      
      // Center the canvas
      diceCanvas.style.width = W + 'px';
      diceCanvas.style.height = H + 'px';
      diceCanvas.style.position = 'absolute';
      diceCanvas.style.top = '50%';
      diceCanvas.style.left = '50%';
      diceCanvas.style.transform = 'translate(-50%, -50%)';

      // Lighting (dramatic)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      diceScene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(3, 5, 5);
      diceScene.add(dirLight);

      // Pink accent lights (from multiple angles for glow effect)
      const pinkLight1 = new THREE.PointLight(0xFF5C86, 1.5, 10);
      pinkLight1.position.set(-2, 2, 2);
      diceScene.add(pinkLight1);

      const pinkLight2 = new THREE.PointLight(0xFF3366, 1, 10);
      pinkLight2.position.set(2, -1, 1);
      diceScene.add(pinkLight2);

      // Create D20 (Icosahedron)
      const diceRadius = 1.2;
      const diceGeom = new THREE.IcosahedronGeometry(diceRadius, 0);

      // D20 Material (Polished Pink Resin with glow)
      const d20Material = new THREE.MeshStandardMaterial({
        color: 0xFF5C86,
        metalness: 0.6,
        roughness: 0.05,
        emissive: 0xFF3366,
        emissiveIntensity: 0.4,
        side: THREE.DoubleSide
      });

      diceMesh = new THREE.Mesh(diceGeom, d20Material);
      diceMesh.position.set(0, 0, 0);

      // Add white edge lines for realism
      const edgeGeom = new THREE.EdgesGeometry(diceGeom, 1);
      const edgeMat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.7 });
      const edgeLines = new THREE.LineSegments(edgeGeom, edgeMat);
      diceMesh.add(edgeLines);

      // Add face numbers (1-20)
      addD20FaceNumbers(diceMesh, diceGeom, diceRadius);

      diceScene.add(diceMesh);

      console.log('D20 Engine initialized with face numbers');
      return true;
    }

    // Create number texture for a face
    function createNumberTexture(number) {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = 'white';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(number.toString(), 32, 32);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // Add numbers to D20 faces using properly oriented planes
    function addD20FaceNumbers(mesh, geometry, radius) {
      const positions = geometry.attributes.position.array;
      const faceCount = positions.length / 9;
      
      for (let i = 0; i < Math.min(faceCount, 20); i++) {
        const baseIdx = i * 9;
        
        // Get vertex positions
        const v0 = new THREE.Vector3(positions[baseIdx], positions[baseIdx + 1], positions[baseIdx + 2]);
        const v1 = new THREE.Vector3(positions[baseIdx + 3], positions[baseIdx + 4], positions[baseIdx + 5]);
        const v2 = new THREE.Vector3(positions[baseIdx + 6], positions[baseIdx + 7], positions[baseIdx + 8]);
        
        // Face center
        const center = new THREE.Vector3().addVectors(v0, v1).add(v2).divideScalar(3);
        
        // Face normal
        const edge1 = new THREE.Vector3().subVectors(v1, v0);
        const edge2 = new THREE.Vector3().subVectors(v2, v0);
        const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();
        
        // Create local coordinate frame for the face
        // Use edge1 normalized as the "right" direction, compute "up" from cross
        const tangent = edge1.clone().normalize();
        const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
        
        // Create number plane
        const texture = createNumberTexture(i + 1);
        const planeMaterial = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        
        const planeGeom = new THREE.PlaneGeometry(0.35, 0.35);
        const planeMesh = new THREE.Mesh(planeGeom, planeMaterial);
        
        // Position at face center, pushed slightly outward
        planeMesh.position.copy(center).add(normal.clone().multiplyScalar(0.02));
        
        // Build rotation matrix from local frame (tangent, bitangent, normal)
        const rotMatrix = new THREE.Matrix4();
        rotMatrix.makeBasis(tangent, bitangent, normal);
        planeMesh.setRotationFromMatrix(rotMatrix);
        
        mesh.add(planeMesh);
      }
    }

    // Store face normals for orienting result
    let faceNormals = [];

    function calculateFaceNormals(geometry) {
      const positions = geometry.attributes.position.array;
      const faceCount = positions.length / 9;
      faceNormals = [];
      
      for (let i = 0; i < Math.min(faceCount, 20); i++) {
        const baseIdx = i * 9;
        const v0 = new THREE.Vector3(positions[baseIdx], positions[baseIdx + 1], positions[baseIdx + 2]);
        const v1 = new THREE.Vector3(positions[baseIdx + 3], positions[baseIdx + 4], positions[baseIdx + 5]);
        const v2 = new THREE.Vector3(positions[baseIdx + 6], positions[baseIdx + 7], positions[baseIdx + 8]);
        
        const edge1 = new THREE.Vector3().subVectors(v1, v0);
        const edge2 = new THREE.Vector3().subVectors(v2, v0);
        const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();
        
        faceNormals.push(normal);
      }
    }

    function rollDice() {
      // Hide menu, show canvas
      gameStartScreen.style.display = 'none';
      diceCanvas.style.display = 'block';

      // Initialize engine if needed
      if (!diceScene && !initDiceEngine()) {
        alert('3D引擎加载失败');
        return;
      }

      // Calculate face normals if not done
      if (faceNormals.length === 0) {
        calculateFaceNormals(diceMesh.geometry);
      }

      // Pre-determine result (1-20)
      diceResult = Math.floor(Math.random() * 20) + 1;
      console.log('Dice result will be:', diceResult);

      // Animation parameters
      const duration = 2500;
      const startTime = performance.now();

      // Random start rotation
      const startRotation = {
        x: Math.random() * Math.PI * 2,
        y: Math.random() * Math.PI * 2,
        z: Math.random() * Math.PI * 2
      };

      // Tumble rotation
      const tumbleRotation = {
        x: (Math.random() * 3 + 4) * Math.PI,
        y: (Math.random() * 2 + 3) * Math.PI,
        z: (Math.random() * 2 + 2) * Math.PI
      };

      // Calculate target rotation to face result toward camera
      const faceIndex = diceResult - 1;
      const faceNormal = faceNormals[faceIndex] || new THREE.Vector3(0, 0, 1);
      const cameraDir = new THREE.Vector3(0, 0, 1);
      
      // Create quaternion that rotates faceNormal to point at camera
      const targetQuaternion = new THREE.Quaternion();
      targetQuaternion.setFromUnitVectors(faceNormal, cameraDir);
      const targetEuler = new THREE.Euler().setFromQuaternion(targetQuaternion);

      function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
      }

      function scalePulse(t) {
        if (t < 0.2) return 0.8 + 0.4 * (t / 0.2);
        else if (t < 0.5) return 1.2 - 0.2 * ((t - 0.2) / 0.3);
        else return 1.0;
      }

      if (diceAnimationId) cancelAnimationFrame(diceAnimationId);
      diceMesh.position.set(0, 0, 0);

      let intermediateRotation = null;

      function animate() {
        const now = performance.now();
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        const rotProgress = easeOutQuart(progress);
        
        // Tumble rotation (decelerating throughout)
        const tumbleX = startRotation.x + tumbleRotation.x * rotProgress;
        const tumbleY = startRotation.y + tumbleRotation.y * rotProgress;
        const tumbleZ = startRotation.z + tumbleRotation.z * rotProgress;
        
        // Blend toward target - starts gradual, accelerates at end
        // Use an S-curve: slow start, accelerate in middle, slow at end
        const blendWeight = progress * progress * (3 - 2 * progress); // smoothstep
        
        // Apply blend
        diceMesh.rotation.x = tumbleX * (1 - blendWeight) + targetEuler.x * blendWeight;
        diceMesh.rotation.y = tumbleY * (1 - blendWeight) + targetEuler.y * blendWeight;
        diceMesh.rotation.z = tumbleZ * (1 - blendWeight) + targetEuler.z * blendWeight;

        const scale = scalePulse(progress);
        diceMesh.scale.set(scale, scale, scale);

        diceRenderer.render(diceScene, diceCamera);

        if (progress < 1) {
          diceAnimationId = requestAnimationFrame(animate);
        } else {
          diceAnimationId = null;
          showDiceResult(diceResult);
        }
      }

      animate();
    }

      if (SSR_RANKS.includes(rank)) return 1;     // 2% / 2 = 1% each
      return 5; // fallback
    }

    function drawOneWeighted(pool) {
      const totalWeight = pool.reduce((sum, card) => sum + getCardWeight(card.rank), 0);
      let random = Math.random() * totalWeight;
      
      for (const card of pool) {
        random -= getCardWeight(card.rank);
        if (random <= 0) return card;
      }
      return pool[pool.length - 1]; // fallback
    }

    // Core draw function with rules:
    // - Only 1 position card (♠️) per draw
    // - JOKER only included when diceResult === 20
    function drawFateCards(count = 5, diceResult = 0) {
      // ⚡ Key: JOKER only enters pool when D20 = 20
      let availableDeck = diceResult === 20
        ? [...fateCardDeck]                                      // D20=20: 54 cards (with JOKER)
        : fateCardDeck.filter(c => !c.rank.startsWith('JOKER')); // Others: 52 cards (no JOKER)
      
      let drawnCards = [];
      let hasPosition = false; // Track if we already drew a position card
      
      console.log(`[drawFateCards] Starting draw: count=${count}, diceResult=${diceResult}, poolSize=${availableDeck.length}`);
      
      for (let i = 0; i < count; i++) {
        // If already have a position card, exclude all ♠️ from pool
        let currentPool = hasPosition 
          ? availableDeck.filter(c => c.suit !== 'spade')
          : availableDeck;
        
        if (currentPool.length === 0) {
          console.log('[drawFateCards] No more cards to draw');
          break;
        }
        
        // Weighted draw
        const card = drawOneWeighted(currentPool);
        drawnCards.push(card);
        
        console.log(`[drawFateCards] Drew: ${card.rank} ${card.suit} - ${card.title}`);
        
        // Mark if position card was drawn
        if (card.suit === 'spade') {
          hasPosition = true;
          console.log('[drawFateCards] Position card drawn, excluding future ♠️');
        }
        
        // Remove drawn card from available deck (no duplicates)
        availableDeck = availableDeck.filter(c => c !== card);
      }
      
      console.log(`[drawFateCards] Final draw: ${drawnCards.map(c => c.title).join(', ')}`);
      return drawnCards;
    }
